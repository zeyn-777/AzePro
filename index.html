<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AZE PRO | Video & Music</title>
    <style>
        body { font-family: sans-serif; background: #000; color: white; margin: 0; padding: 20px; }
        .header { text-align: center; padding: 20px; color: #ff0000; }
        .video-container { max-width: 800px; margin: auto; background: #111; padding: 15px; border-radius: 10px; }
        iframe { width: 100%; height: 450px; border-radius: 8px; border: none; }
        .controls { margin-top: 15px; display: flex; gap: 10px; justify-content: center; }
        input { padding: 10px; width: 60%; border-radius: 5px; border: none; }
        button { padding: 10px 20px; background: #ff0000; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .download-btn { background: #28a745; text-decoration: none; padding: 10px 20px; color: white; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <h1>AZE PRO Stream</h1>
    </div>

    <div class="video-container">
        <div id="player">
            <p style="text-align:center;">İzləmək üçün YouTube linkini aşağıya yapışdırın</p>
        </div>

        <div class="controls">
            <input type="text" id="videoLink" placeholder="YouTube Video Linkini bura qoyun...">
            <button onclick="playVideo()">İzlə</button>
        </div>
        
        <div class="controls">
            <a id="downloadLink" href="#" target="_blank" class="download-btn" style="display:none;">MP3/Video Yüklə</a>
        </div>
    </div>

    <script>
        function playVideo() {
            let url = document.getElementById('videoLink').value;
            let videoId = url.split('v=')[1]?.split('&')[0] || url.split('/').pop();
            
            if(videoId) {
                // Videonu göstər
                document.getElementById('player').innerHTML = 
                    `<iframe src="https://www.youtube.com/embed/${videoId}" allowfullscreen></iframe>`;
                
                // Yükləmə düyməsini aktiv et (Xarici servis vasitəsilə)
                let dlBtn = document.getElementById('downloadLink');
                dlBtn.style.display = 'block';
                dlBtn.href = `https://9xbuddy.com/process?url=https://www.youtube.com/watch?v=${videoId}`;
            }
        }
    </script>

</body>
</html>
