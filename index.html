<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AZE YOTUBE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f0f0f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        /* ÜMUMİ TƏNZİMLƏMƏLƏR (HƏM PC, HƏM MOBİL) */
        :root { --bg: #0f0f0f; --card: #1e1e1e; --text: #fff; --red: #ff0000; }
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); padding-top: 60px; }
        * { box-sizing: border-box; }

        /* NAVİQASİYA (BAŞLIQ) */
        nav { 
            position: fixed; top: 0; left: 0; width: 100%; height: 60px; 
            background: rgba(15, 15, 15, 0.95); backdrop-filter: blur(10px);
            display: flex; align-items: center; justify-content: space-between; 
            padding: 0 20px; z-index: 1000; border-bottom: 1px solid #333;
        }
        .logo { font-size: 20px; font-weight: bold; letter-spacing: -0.5px; display: flex; align-items: center; gap: 5px; }
        .logo i { color: var(--red); font-size: 24px; }
        
        /* AXTARIŞ (PC ÜÇÜN) */
        .search-box { flex: 1; max-width: 600px; margin: 0 20px; display: flex; }
        .search-box input { 
            width: 100%; padding: 10px 15px; background: #121212; border: 1px solid #333; 
            border-radius: 20px 0 0 20px; color: white; outline: none; font-size: 16px;
        }
        .search-box button { 
            padding: 0 20px; background: #222; border: 1px solid #333; border-left: none; 
            border-radius: 0 20px 20px 0; color: #aaa; cursor: pointer; 
        }

        /* VİDEO QALEREYA (RESPONSIVE GRID) */
        .grid { 
            display: grid; 
            /* Sehrli Kod: Ekran böyükdürsə 4-5 dənə, kiçikdirsə 1 dənə yerləşdirir */
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); 
            gap: 20px; padding: 20px; 
        }

        .card { background: var(--card); border-radius: 12px; overflow: hidden; cursor: pointer; transition: transform 0.2s; }
        .card:hover { transform: translateY(-5px); } /* PC-də siçanla üstünə gələndə qalxır */
        
        .thumbnail { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; }
        .info { padding: 12px; }
        .title { font-size: 16px; font-weight: 600; margin-bottom: 5px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .meta { font-size: 13px; color: #aaa; }

        /* PLEYER MODAL (TAM EKRAN) */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; z-index: 2000; }
        .modal-content { width: 100%; height: 100%; display: flex; flex-direction: column; }
        .video-container { width: 100%; aspect-ratio: 16/9; background: black; }
        iframe { width: 100%; height: 100%; border: none; }
        .details-box { padding: 20px; flex: 1; overflow-y: auto; }
        .close-btn { position: absolute; top: 15px; right: 20px; color: white; font-size: 30px; cursor: pointer; z-index: 2100; text-shadow: 0 0 5px black; }

        .btn-download {
            display: block; width: 100%; padding: 12px; margin-top: 15px;
            background: #333; color: white; text-align: center; text-decoration: none;
            border-radius: 8px; font-weight: bold; border: 1px solid #444;
        }

        /* MOBİL ÜÇÜN XÜSUSİ TƏNZİMLƏMƏLƏR (TELEFONLAR) */
        @media (max-width: 768px) {
            .search-box { display: none; } /* Mobildə yuxarıdakı uzun axtarışı gizlət */
            .grid { grid-template-columns: 1fr; gap: 0; padding: 0; } /* Mobildə tək sütun */
            .card { border-radius: 0; margin-bottom: 10px; border-bottom: 1px solid #333; box-shadow: none; }
            .card:hover { transform: none; }
            .info { padding: 15px; }
            .title { font-size: 15px; }
            .mobile-search-icon { display: block !important; font-size: 20px; padding: 10px; }
        }
        .mobile-search-icon { display: none; }
    </style>
</head>
<body>

    <nav>
        <div class="logo"><i class="fab fa-youtube"></i> AZE YOTUBE</div>
        
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Axtarış..." onkeyup="search()">
            <button><i class="fas fa-search"></i></button>
        </div>

        <i class="fas fa-search mobile-search-icon" onclick="toggleSearch()"></i>
    </nav>

    <div id="mobileSearchPanel" style="display:none; padding:10px; background:#202020; position:fixed; top:60px; width:100%; z-index:999;">
        <input type="text" id="mobileInput" placeholder="Nə izləmək istəyirsiniz?" style="width:100%; padding:10px; border-radius:5px; border:none; background:#333; color:white;" onkeyup="search(this.value)">
    </div>

    <div class="grid" id="videoContainer"></div>

    <div id="videoPlayer" class="modal">
        <div class="close-btn" onclick="closePlayer()">&times;</div>
        <div class="modal-content">
            <div class="video-container">
                <div id="iframeBox" style="width:100%; height:100%;"></div>
            </div>
            <div class="details-box">
                <h2 id="pTitle" style="margin-top:0;"></h2>
                <p id="pAuthor" style="color:#aaa;"></p>
                <hr style="border-color:#333;">
                <p style="font-size:14px; color:#ccc;">Bu videonu izləyirsiniz.</p>
                
                <a href="#" id="pDownload" class="btn-download" onclick="alert('Yükləmə linki tezliklə əlavə olunacaq!')">
                    <i class="fas fa-download"></i> Yüklə (Tezliklə)
                </a>
            </div>
        </div>
    </div>

    <script>
        // --- VİDEOLARI BURA ƏLAVƏ ET ---
        const videos = [
            { id: "jfKfPfyJRdk", title: "Lofi Girl - Relax Music", author: "Lofi Girl" },
            { id: "kJQP7kiw5Fk", title: "Despacito - Luis Fonsi", author: "Luis Fonsi" },
            { id: "JGwWNGJdvx8", title: "Shape of You - Ed Sheeran", author: "Ed Sheeran" },
            { id: "LXb3EKWsInQ", title: "4K Təbiət Mənzərəsi", author: "Nature" },
            { id: "F4tHL8reNCs", title: "PlayStation 5 Review", author: "IGN" }
        ];

        const container = document.getElementById('videoContainer');

        function loadVideos(list) {
            container.innerHTML = "";
            list.forEach(v => {
                let div = document.createElement('div');
                div.className = 'card';
                div.onclick = () => openPlayer(v);
                div.innerHTML = `
                    <img src="https://img.youtube.com/vi/${v.id}/mqdefault.jpg" class="thumbnail" loading="lazy">
                    <div class="info">
                        <div class="title">${v.title}</div>
                        <div class="meta">${v.author}</div>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        // Axtarış Sistemi
        function search(val) {
            let text = val || document.getElementById('searchInput').value;
            loadVideos(videos.filter(v => v.title.toLowerCase().includes(text.toLowerCase())));
        }

        function toggleSearch() {
            let p = document.getElementById('mobileSearchPanel');
            p.style.display = p.style.display === 'none' ? 'block' : 'none';
        }

        // Pleyer Funksiyaları
        function openPlayer(video) {
            document.getElementById('videoPlayer').style.display = 'block';
            document.getElementById('iframeBox').innerHTML = `<iframe src="https://www.youtube.com/embed/${video.id}?autoplay=1&modestbranding=1&rel=0" allowfullscreen allow="autoplay"></iframe>`;
            document.getElementById('pTitle').innerText = video.title;
            document.getElementById('pAuthor').innerText = video.author;
        }

        function closePlayer() {
            document.getElementById('videoPlayer').style.display = 'none';
            document.getElementById('iframeBox').innerHTML = ""; // Videonu dayandır
        }

        // Başlanğıc
        loadVideos(videos);
    </script>

</body>
</html>
